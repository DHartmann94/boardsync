<mat-card class="task-card">

    @if (category; as cat) {
    <div class="task-card__badge" [style.background-color]="cat.color">
        {{ cat.type }}
    </div>
    }

    <div class="task-card__content">
        <h4 class="task-card__title" [title]="task.title">
            {{ task.title }}
        </h4>

        <p class="task-card__description">
            {{ task.description }}
        </p>
    </div>

    @if (totalSubtasks > 0) {
    <div class="task-card__subtasks">
        <mat-progress-bar mode="determinate" [value]="progress">
        </mat-progress-bar>
        <span>
            {{ completedSubtasks }}/{{ totalSubtasks }}
            Subtasks
        </span>
    </div>
    }

    <div class="task-card__footer">
        <div class="task-card__users">
            @for (user of visibleUsers; track user.id) {
            <div class="task-card__avatar" [class.task-card__avatar--own]="user.isOwn" [title]="user.fullName">
                {{ user.avatar }}
            </div>
            }

            @if (hiddenUsers.length > 0) {
            <div class="task-card__avatar task-card__avatar--more" [title]="hiddenNames">
                +{{ hiddenUsers.length }}
            </div>
            }
        </div>

        <img class="task-card__priority" [src]="prioIcon" [alt]="task.prio" />
    </div>

</mat-card>
