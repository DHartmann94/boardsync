<mat-nav-list>
  
  <a
    mat-list-item
    title="Sidebar öffnen oder schließen">
  <span class="nav-content">
      <button
        mat-icon-button
        (click)="onToggleSidebar()"
        aria-label="Sidebar öffnen oder schließen">
        <mat-icon class="material-symbols-outlined">menu</mat-icon>
      </button>
    </span>
  </a>
  <a
    mat-list-item
    routerLink="/main/add-tasks"
    routerLinkActive="active"
    [attr.aria-label]="collapsed() ? 'Add Tasks' : null"
    title="Add Tasks">
    <span class="nav-content">
      <span class="nav-label">Add Tasks</span>
      <mat-icon class="material-symbols-outlined">Assignment_add</mat-icon>
    </span>
  </a>
</mat-nav-list>
